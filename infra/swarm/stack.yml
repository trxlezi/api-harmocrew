services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harmocrew
      POSTGRES_USER: harmocrew
      POSTGRES_PASSWORD: harmocrew
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmocrew -d harmocrew"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  api:
    image: registry:5000/harmocrew-api:latest
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/harmocrew
      SPRING_DATASOURCE_USERNAME: harmocrew
      SPRING_DATASOURCE_PASSWORD: harmocrew
      APP_JWT_SECRET: harmocrew-swarm-demonstration-secret
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - backend
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
